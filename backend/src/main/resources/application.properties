spring.application.name=motorva
motorva.openai-key=${OPENAI_API_KEY:}
motorva.openai-model=${OPENAI_MODEL:gpt-4.1-mini}
motorva.ai-account-daily-limit=${AI_ACCOUNT_DAILY_LIMIT:10}
motorva.ai-global-daily-limit=${AI_GLOBAL_DAILY_LIMIT:100}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/postgresql
spring.flyway.default-schema=motorva
spring.flyway.schemas=motorva
spring.jpa.properties.hibernate.default_schema=motorva
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
motorva.supabase-url=${SUPABASE_URL}
motorva.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3001}
server.error.include-message=never
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.accept-float-as-int=false
